  name: C9 H1L — Comparer le profil vidéo capturé au modèle sans PCAP (B147)
  description: >-
    Comparaison locale et facultative de cinq commandes de la C9 n°2
    déjà validée. Aucun envoi LAN ni donnée sensible retournée.
    Aucune capture requise pour le fonctionnement normal des caméras.
  fields:
    ip_station:
      required: true
      selector:
        text: {}
    confirmation_capture_personnelle:
      required: true
