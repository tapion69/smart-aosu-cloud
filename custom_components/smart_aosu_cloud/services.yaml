audit_routage_c9_h1l_b151:
  name: C9 H1L — Audit des identifiants et profils PCAP (B151)
  description: >-
    Diagnostic hors ligne uniquement. Vérifie les deux identités OEM en cache et,
    si présentes dans /config/smart_aosu_traces/, compare les anciennes captures
    personnelles de développement. Ne lance aucune commande, aucune connexion,
    aucun déchiffrement inventé lorsque l'offre SDP de capture est absente.
    Les PCAP ne sont jamais requis pour le direct normal.
  fields:
    ip_station:
      required: true
      selector:
        text: {}
    confirmation_captures_personnelles:
      required: true
      selector:
        boolean: {}

autoriser_essai_ptz_c9_b159:
  name: C9 H1L - autoriser un essai PTZ temporaire (B159)
  description: >-
    Autorise pendant 120 secondes des mouvements PTZ experimentaux sur une C9
    dont le direct affiche deja des images. Identite OEM verifiee sans PCAP,
    aucun mouvement automatique. Les commandes 119/116 ont ete utilisees sur
    la C5L mais ne sont pas certifiees pour la C9. STOP et watchdog tentent
    un arret sans pouvoir verifier physiquement le moteur. Garder AOSU pret.
  fields:
    camera_numero:
      name: Numero C9
      required: true
      selector:
        number:
          min: 1
          max: 2
          step: 1
    confirmation_deplacement:
      name: J'autorise un essai de mouvement physique de cette C9
      required: true
      selector:
        boolean: {}
    confirmation_stop_disponible:
      name: Je peux ouvrir AOSU immediatement si le STOP ne fonctionne pas
      required: true
      selector:
        boolean: {}

autoriser_ptz_c9_stable:
  name: C9 H1L - valider definitivement le PTZ (0.8.9)
  description: >-
    Enregistre dans Home Assistant une autorisation permanente pour une C9
    identifiee sans PCAP. Requiert une image du direct et la confirmation que
    cette camera a deja ete deplacee et qu'elle s'est physiquement arretee au
    relachement. Aucune commande de mouvement n'est envoyee par cette action.
    L'autorisation est liee a l'identite OEM de cette camera, et ne s'applique
    pas automatiquement a la deuxieme C9. Le STOP et le watchdog restent actifs.
  fields:
    camera_numero:
      name: Numero de la camera C9 (1 ou 2)
      required: true
      selector:
        number:
          min: 1
          max: 2
          step: 1
    confirmation_camera_correcte:
      name: Je confirme que je vois la bonne camera dans son direct
      required: true
      selector:
        boolean: {}
    confirmation_deplacement_et_stop:
      name: Je confirme le mouvement et l'arret physique apres relachement
      required: true
      selector:
        boolean: {}

retirer_ptz_c9_stable:
  name: C9 H1L - retirer l'autorisation PTZ (0.8.9)
  description: >-
    Retire l'autorisation permanente de cette camera uniquement, sans toucher
    aux autres cameras. Si un mouvement est en cours, STOP est demande.
  fields:
    camera_numero:
      name: Numero de la camera C9 (1 ou 2)
      required: true
      selector:
        number:
          min: 1
          max: 2
          step: 1


demarrer_video_c9c_autonome_beta:
  name: C9C autonome — essai vidéo expérimental (sans PTZ)
  description: >-
    Tentative volontaire du protocole vidéo P2P C5L sur UNE caméra C9C autonome,
    sans station H1L et sans commande PTZ. Le protocole n'est pas encore validé
    sur ce modèle. Les trois confirmations sont obligatoires. Aucune reprise
    automatique n'est lancée.
  fields:
    confirmation_camera_c9c_autonome:
      name: Confirmer caméra C9C autonome unique sans station
      required: true
      selector:
        boolean: {}
    confirmation_essai_video:
      name: Autoriser une session vidéo expérimentale
      required: true
      selector:
        boolean: {}
    confirmation_envoi_mot_de_passe:
      name: Autoriser l'authentification Tuya pour ce direct
      required: true
      selector:
        boolean: {}

diagnostiquer_identite_c9c_autonome:
  name: C9C autonome — comparer les identités AOSU et Tuya
  description: >-
    Compare les identifiants seulement en mémoire, sans jamais les afficher.
    Lit au besoin l'inventaire Tuya du compte (authentification chiffrée)
    si le cache est absent ou ancien. Aucune demande vidéo, MQTT, RTC,
    PTZ ou commande caméra n'est envoyée. La catégorie seule ne garantit
    jamais que les identités correspondent.
  fields:
    confirmation_lecture_tuya:
      name: Autoriser la lecture de l'inventaire Tuya
      required: true
      selector:
        boolean: {}

diagnostiquer_c9c_complet_b31:
  name: C9C autonome — diagnostic complet en une seule action
  description: >-
    Une session UID, six lectures Tuya au maximum : appareil,
    produit, modèle si version disponible, IPC v2, RTC IPC-v4 et
    RTC classique. Aucune publication MQTT, réveil, offre, vidéo
    ou PTZ. Les identifiants, clés et réponses brutes restent en RAM.
    Les temporisations beta28 restent appliquées.
  fields:
    confirmation_diagnostic_complet:
      name: Autoriser les lectures de diagnostic en une seule opération
      required: true
      selector:
        boolean: {}

diagnostiquer_fiche_tuya_c9c_b27:
  name: C9C autonome — comparer la fiche Tuya sans vidéo
  description: >-
    Une requête HTTPS déjà autorisée thing.m.device.get v4.1 pour
    le seul candidat Tuya de la caméra C9C autonome. Distingue SN absent,
    SN présent sans égalité, correspondance exacte et référence AOSU
    indisponible. Expose uniquement la présence de blocs productBean,
    productId, skills, capacités et P2P. Aucun ID, SN ou productId brut.
    Un modèle C9C identique ne prouve pas l'identité.
    Classifie uniquement le champ numérique skills.p2pType selon l'enum
    du SDK AOSU (2 PPCS, 4 Thing, sinon inconnu), sans valeur privée.
    Aucun réveil, MQTT, SDP, direct, PTZ ou enregistrement.
    Respecte le cooldown de cinq minutes des lectures de configuration.
    Peut réutiliser l'inventaire Tuya récent et, si la session a expiré,
    autorise une seule reconnexion manuelle toutes les vingt minutes.
    Les autres diagnostics gardent la limite de login d'une heure.
  fields:
    confirmation_lecture_fiche_tuya:
      name: Autoriser la lecture de la fiche Tuya du candidat
      required: true
      selector:
        boolean: {}

diagnostiquer_fiche_c9c_autonome:
  name: C9C autonome — consulter la fiche AOSU (lecture seule)
  description: >-
    Une requête HTTPS de fiche détaillée AOSU par heure au maximum pour une
    unique C9C autonome, sans H1L. Compare les références en mémoire avec
    l'inventaire Tuya existant, ne retourne aucun identifiant ni valeur privée.
    Aucun démarrage vidéo, aucune commande caméra ou PTZ.
  fields:
    confirmation_lecture_fiche:
      name: Autoriser la lecture de la fiche détaillée AOSU
      required: true
      selector:
        boolean: {}

diagnostiquer_rtc_c9c_autonome:
  name: C9C autonome — examiner la configuration RTC sans vidéo
  description: >-
    Une lecture explicite des paramètres RTC de l'unique candidat Tuya,
    sans publication MQTT, sans SDP envoyé, sans vidéo ou PTZ.
    Peut s'authentifier au service Tuya avec le mot de passe AOSU déjà configuré.
    Les limites de fréquence existantes sont conservées ; seuls des booléens
    et des valeurs prédéfinies sont retournés.
  fields:
    confirmation_lecture_rtc:
      name: Autoriser cette lecture RTC et l'authentification nécessaire
      required: true
      selector:
        boolean: {}

observer_mqtt_c9c_autonome:
  name: C9C autonome — observer MQTT sans envoyer d'offre
  description: >-
    Après authentification et lecture RTC de l'unique candidat Tuya, ouvre
    une observation volontaire des deux canaux de signalisation pendant 20 s.
    Ouvrir le direct dans l'application AOSU officielle pendant cette fenêtre.
    Aucun message MQTT n'est publié ; aucun contenu de paquet, nom, IP ou jeton
    n'est conservé ou renvoyé. Une seule observation toutes les 10 minutes.
    Peut nécessiter une authentification Tuya sur le compte AOSU configuré.
  fields:
    confirmation_ecoute_mqtt:
      name: Autoriser une connexion et une écoute MQTT passive
      required: true
      selector:
        boolean: {}

comparer_rtc_ipc_v4_c9c_autonome:
  name: C9C autonome — comparer la configuration RTC IPC-v4
  description: >-
    Essai volontaire en lecture cloud sur m.ipc.v4.rtc.config.get pour
    l'unique C9C autonome expérimentale. Vérifie si Tuya accepte
    l'API RTC spécifique aux caméras IPC et fournit un bootstrap média.
    Aucune offre MQTT, session vidéo, capture ou commande PTZ.
    Les limites de lecture RTC existantes sont conservées.
  fields:
    confirmation_lecture_rtc_v4:
      name: Autoriser la lecture RTC IPC-v4
      required: true
      selector:
        boolean: {}

analyser_sdk_mqtt_c9c_b25:
  name: C9C autonome — analyser SDK MQTT dans APK local (sans réseau)
  description: >-
    Inspecte uniquement la table de chaînes des DEX de la version AOSU
    5.10.12 dont l'empreinte SHA256 est connue. Aucun accès réseau, login,
    requête RTC/MQTT, réveil, offre vidéo ou PTZ. Résultat booléen sans
    chaînes brutes, identifiants ou secrets. La version allégée ne contient
    qu'une partie du SDK. Si l'APK original exact est présent dans le
    même dossier que l'APK configuré, il est préféré pour cette inspection.
    Quinze minutes entre deux analyses manuelles.
  fields:
    confirmation_analyse_apk_locale:
      name: Autoriser la lecture locale de l'APK AOSU
      required: true
      selector:
        boolean: {}

comparer_ipc_v2_c9c_autonome_b24:
  name: C9C autonome — lire IPC v2 (sans vidéo)
  description: >-
    Requête HTTPS manuelle thing.m.ipc.config.get v2.0 sur la caméra C9C
    autonome sélectionnée. Résultat anonymisé pour WebRTC, moto_id, auth
    et msid. Aucune commande, MQTT, SDP, vidéo ou PTZ.
    Temporisation de cinq minutes partagée avec les lectures RTC.
  fields:
    confirmation_lecture_ipc_v2:
      name: Autoriser cette lecture IPC v2
      required: true
      selector:
        boolean: {}

comparer_webrtc_c9c_autonome_b23:
  name: C9C autonome — diagnostiquer le canal WebRTC sans vidéo
  description: >-
    Vérifie les métadonnées RTC IPC-v4 autorisées pour une C9C autonome :
    moto_id, auth WebRTC, msid explicite, sans retourner leurs valeurs.
    Si confirmation_ecoute_webrtc est vraie et un msid unique existe, tente
    UNIQUEMENT une souscription MQTT au canal WebRTC. Aucun PUBLISH, SDP,
    réveil, vidéo ou PTZ. Conserve les limitations RTC et 10 minutes pour
    le test de souscription. Ne devine jamais un msid depuis l'UID.
  fields:
    confirmation_lecture_webrtc:
      name: Autoriser la lecture RTC IPC-v4
      required: true
      selector:
        boolean: {}
    confirmation_ecoute_webrtc:
      name: Autoriser le test de souscription MQTT sans envoi
      required: false
      selector:
        boolean: {}

tester_reveil_c9c_autonome:
  name: C9C autonome — tester le réveil expérimental
  description: >-
    ATTENTION : cette action ENVOIE une commande MQTT réelle de réveil
    vers l'unique candidat C9C autonome. Une seule commande, aucune
    vidéo ni PTZ, et dix minutes au minimum entre essais. Elle utilise
    un paquet CRC32 de la clé locale en mémoire, sans afficher cette clé.
    Le résultat MQTT PUBACK seul ne prouve pas le réveil physique.
    Ne pas utiliser en même temps que l'application AOSU ou un direct HA.
  fields:
    confirmation_reveil_experimental:
      name: J'autorise l'envoi de la commande expérimentale de réveil
      required: true
      selector:
        boolean: {}


tester_offre_http_thing4_c9c:
  name: C9C autonome — une seule négociation RTC HTTP (essai b44)
  description: >-
    ESSAI EXPERIMENTAL ET MANUEL. Ouvre UNE demande HTTP
    thing.m.rtc.session.offer v1.0 sur l'unique appareil Tuya de ce compte.
    La correspondance du candidat avec le SN AOSU n'est pas formellement
    prouvee : confirmer que cette installation est bien celle de la C9C
    autonome, sans station H1L. Peut creer un etat de session distant.
    Pas de MQTT, d'image, de reveil, de PTZ ni de stockage de secrets.
    Une seule demande toutes les 60 minutes, sans tentative automatique.
    Fermer la video dans l'application AOSU avant cet essai.
  fields:
    confirmation_camera_c9c_autonome:
      name: Je confirme qu'il s'agit de la seule C9C autonome de ce compte
      required: true
      selector:
        boolean: {}
    confirmation_cible_unique_non_prouvee:
      name: J'autorise l'unique cible Tuya, sans correspondance SN prouvee
      required: true
      selector:
        boolean: {}
    confirmation_offre_http:
      name: J'autorise une seule creation de session RTC HTTP
      required: true
      selector:
        boolean: {}


comparer_sn_application_c9c:
  name: C9C autonome — comparer le SN de l'application AOSU
  description: >-
    Compare en mémoire le SN recopié depuis l'application AOSU officielle
    avec le SN AOSU de la C9C autonome déjà reçu par Home Assistant.
    Aucune connexion réseau, offre HTTP, MQTT, vidéo ou PTZ.
    Les numéros de série ne figurent jamais dans la réponse ni dans
    les journaux de l'intégration. Cette égalité ne prouve PAS la
    correspondance séparée entre le SN AOSU et l'identifiant Tuya.
    Ne pas partager la saisie du SN ni une capture de ce formulaire.
  fields:
    sn_application_aosu:
      name: SN affiché par l'application AOSU
      description: Saisir le SN exactement comme affiché dans AOSU, sans espaces ajoutés
      required: true
      selector:
        text:
          type: password
