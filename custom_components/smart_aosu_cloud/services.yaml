    noms, secrets et valeurs RTC ne sont pas retournes.
  fields:
    numero_camera_aosu:
      name: Numero de la camera C9 dans l'inventaire AOSU
      required: true
      selector:
        number:
          min: 1
          max: 2
          step: 1
