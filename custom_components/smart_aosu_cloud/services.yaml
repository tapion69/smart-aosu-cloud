ptz_maintien_c5l_b83:
  name: C5L — PTZ maintien et STOP (b83)
  description: >-
    Contrôle direct par API Tuya validée pour droite et STOP. Sans préparation,
    case à cocher, dépendance vidéo ni temporisation de 5 minutes. Les flèches
    restent appuyées jusqu'au relâchement, avec arrêt logiciel de secours
    après 12 secondes. Haut/bas/gauche restent à vérifier sur cette caméra.
    STOP reste utilisable indépendamment de la vidéo. L'exécution physique
    dépend du réseau et ne peut pas être attestée par la réponse HTTP.
  fields:
    action:
      required: true
      name: Action
      selector:
        select:
          options: [press, release, stop, status]
    direction:
      name: Direction (press uniquement)
      required: false
      selector:
        select:
          options: [haut, bas, gauche, droite]
    gesture_id:
      name: Identifiant aléatoire de l'appui (press/release)
      required: false
      selector:
        text: {}

tester_direction_c5l_b82:
  name: C5L — essai direction haut, bas ou gauche + STOP auto (b82)
  description: >-
    EXPERIMENTAL. Un seul mouvement de 0,35 s (après réponse serveur),
    STOP DP116 en finally et STOP de secours tenté si nécessaire.
    Un seul essai toutes les 5 minutes (partagé avec B81).
    Sans garantie d'arrêt en cas de panne réseau. Ne jamais laisser
    sans surveillance. Garder l'application AOSU prête pour stopper.
    Les autres directions ne sont pas encore physiquement validées.
  fields:
    direction:
      name: Direction a tester
      required: true
      selector:
        select:
          options:
            - label: Haut (0)
              value: haut
            - label: Bas (4)
              value: bas
            - label: Gauche (6)
              value: gauche
    confirmation_envoi_mot_de_passe:
      name: Autoriser API OEM et authentification si necessaire
      required: true
      selector:
        boolean: {}
    confirmation_camera_c5l:
      name: Confirmer qu'il s'agit de ma C5L C5L
      required: true
      selector:
        boolean: {}
    confirmation_stop_b81_physique:
      name: Confirmer droite et STOP physiquement testes avec B81
      required: true
      selector:
        boolean: {}
    confirmation_application_aosu_secours:
      name: Confirmer application AOSU ouverte pour STOP de secours
      required: true
      selector:
        boolean: {}

inspect_datapoints:
  name: Inspecter les paramètres des appareils (expérimental)
  description: >-
    Effectue un seul appel de lecture vers le service IoT AOSU et renvoie
    uniquement les noms et types des paramètres. Aucun numéro de série,
    jeton ou valeur d'appareil n'est communiqué. Maximum une fois par heure.

inspect_cached_metadata:
  name: Analyser les metadonnees AOSU deja recues (sans reseau)
  description: >-
    Retourne uniquement des noms de champs prevalides, des types et des tailles
    de structures a partir de la derniere liste des appareils deja chargee.
    Aucun nouvel appel HTTP ni commande camera. Pas de valeurs privees.

audit_global:
  name: Audit global AOSU (une seule execution)
  description: >-
    Diagnostic en lecture seule des 4 appareils, liens vers la base, connexion,
    energie/Wi-Fi bruts, horodatages et structures disponibles. Une lecture
    /v1/dev/getList puis au maximum une lecture /v1/dp/getValues. La seconde
    est limitee a une fois par heure. Aucun numero de serie, nom personnalise,
    URL de miniature ou jeton n'est renvoye. Aucune commande camera.

audit_objectifs:
  name: Auditer miniatures et types de detection (v0.8.4)
  description: >-
    Une seule action manuelle : au maximum six lectures AOSU d'images/evenements
    (dont deux requetes ciblees si une camera manque de la liste groupee),
    ainsi qu'un test de miniature par camera (GET HTTPS et redirections controlees).
    Renvoie les statuts des images, les eventType et uniformType bruts autorises,
    ainsi que le nombre d'evenements par camera et le diagnostic cible. Aucun code arbitraire n'est
    traduit en mouvement ou personne sans preuve. Sans numero
    de serie, identifiant, lien prive, jeton ni contenu photo. Une fois par
    heure et par session ; aucune commande video ou PTZ.

audit_transport:
  name: Verifier branche et reference Tuya des cameras (sans reseau)
  description: >-
    Distingue les branches Gz et Tuya selon support.svcType deja recu par
    /v1/dev/getList et la logique de l'APK Android AOSU 5.10.12.
    Controle aussi seulement la presence des references cpDeviceId a la racine
    et sous cpDeviceInfo. Zero requete HTTP, zero mouvement, zero journal prive.
    Aucun identifiant Tuya ou AOSU ne sera affiche ou conserve.

audit_liaison_tuya:
  name: Vérifier liaison Tuya et capacités C5L (lecture seule)
  description: >-
    Diagnostic manuel limité à une fois par heure. Interroge au maximum
    /v1/dev/getInfoBySn et /v1/dev/capability pour la C5L uniquement,
    sans commande PTZ, sans ouverture de vidéo et sans afficher d'identifiant,
    de numéro de série, de jeton ou de réponse brute. Une clé présente ne
    constitue pas la preuve d'une liaison Tuya fonctionnelle.


audit_oem_uid:
  name: Vérifier les paramètres UID Tuya déjà reçus (sans réseau)
  description: >-
    Ne relance pas de connexion. Vérifie uniquement si la dernière réponse de
    connexion AOSU contenait countryCode, tuyaUsername et tuyaUid (orthographe JSON exacte).
    Affiche seulement des booléens, sans identifiants, mot de passe, SID ou token.
    Ne prouve pas que le serveur Tuya acceptera l'authentification OEM.


audit_provider_p2p:
  name: Diagnostiquer le fournisseur P2P depuis le cache AOSU
  description: >-
    Sans aucune requete HTTP supplementaire, verifie la presence des champs
    sdkProvider, p2pType, isVirtual, devId et communicationId dans le dernier
    inventaire AOSU. Ne renvoie ni identifiants, ni noms personnalises, ni
    tokens. Attention, un inventaire AOSU ne prouve pas le DeviceBean Tuya
    reellement utilise par Android.


audit_mqtt_authorisation:
  name: Vérifier l'autorisation AOSU MQTT AWS (APK confirmé)
  description: >-
    Requête manuelle unique /v1/sts/getMultiMqttInfo avec type=aws, valeur
    vérifiée directement dans classes16.dex de l'APK AOSU 5.10.12.
    Cible uniquement la C5L. Une tentative maximum par heure et par processus.
    Réponse uniquement structurelle et anonymisée. Ne lance pas de vidéo.
    Ce chemin Gz/AWS n'est pas une authentification OEM Tuya (plateforme C5L Ty).

audit_tuya_uid_token:
  name: Audit Tuya UID token (experimental)
  description: >
    One manual token-only Tuya request. Uses the SDK-verified
    thing.m.user.username.token.get v2.0 with isUid true, the APK and existing
    AOSU session. Does not send account password or control any camera.
    TTID and Tuya installation ID are experimental assumptions.

audit_tuya_uid_preflight:
  name: Diagnostic APK Tuya UID — hors ligne
  description: >-
    Controle sans connexion reseau : presence de l APK original ou de l APK leger avec ses ressources OEM,
    empreinte SHA-256, extraction des composants et decodage natif.
    Les causes d'arret sont distinguees. Aucune cle ni identifiant expose.

audit_tuya_uid_login:
  name: Tester le login Tuya OEM UID (envoi du mot de passe chiffre)
  description: >-
    Operation sensible et manuelle uniquement. Un jeton Tuya obtenu via
    thing.m.user.username.token.get v2.0 (isUid vrai) puis
    un login Tuya OEM seront effectues ; le mot de passe AOSU deja enregistre
    dans Home Assistant sera transforme en MD5 puis chiffre en RSA, place dans
    un corps chiffre AES-GCM et envoye via HTTPS au serveur Tuya. Le mot de
    passe n'est jamais affiche dans la reponse. Au maximum deux requetes, sans
    mouvement ni video, une tentative par heure. L'algorithme de signature reste
    experimental ; un refus de login est possible.
  fields:
    confirmation_envoi_mot_de_passe:
      name: J'autorise l'envoi du mot de passe chiffre au serveur Tuya
      required: true
      default: false
      selector:
        boolean:


audit_tuya_oem_inventory:
  name: Découvrir les appareils Tuya OEM et préparer RTC (expérimental)
  description: >-
    Utilise une session UID Tuya réussie, seulement en mémoire. Après redémarrage
    de Home Assistant, une nouvelle authentification est nécessaire : elle n'a
    lieu que si vous autorisez explicitement l'envoi du mot de passe chiffré.
    Lit la liste des maisons et appareils, sans exposer leurs identifiants,
    noms, clés ou réponses brutes. Ne lance aucun flux vidéo ni aucune commande.
    Option RTC : lecture unique de la configuration RTC seulement si la C5L
    est reconnue sans ambiguïté ou si vous autorisez un candidat caméra unique.
  fields:
    confirmation_envoi_mot_de_passe:
      name: Autoriser un nouveau login UID si la session a été perdue
      description: Envoie le mot de passe AOSU sous forme chiffrée à Tuya, seulement si nécessaire.
      required: false
      default: false
      selector:
        boolean:
    tester_rtc:
      name: Demander la configuration RTC (lecture seule)
      description: Peut créer une configuration de session provisoire ; ne lit pas la vidéo.
      required: false
      default: false
      selector:
        boolean:
    autoriser_candidat_unique:
      name: Autoriser l'unique caméra candidate non confirmée
      description: À utiliser uniquement si le diagnostic ne trouve qu'une caméra candidate.
      required: false
      default: false
      selector:
        boolean:

    autoriser_correspondance_nom_unique:
      name: Autoriser un appareil dont le nom correspond exactement à celui de la C5L
      description: >-
        Option RTC uniquement. Ne sélectionner que si la comparaison privée des noms
        AOSU/Tuya trouve exactement un appareil. Un nom égal n'est pas une preuve
        d'identité; n'utiliser que si vous reconnaissez cet appareil.
      required: false
      default: false
      selector:
        boolean:
    tester_mqtt:
      name: Tester la signalisation MQTT Tuya (TLS + abonnement, aucune offre)
      description: >-
        Nécessite tester_rtc : true. Après lecture RTC, tente une connexion MQTT
        TLS authentifiée au serveur UE m1.tuyaeu.com:8883, s'abonne uniquement
        au canal de signalisation de la C5L candidate, puis se déconnecte.
        Aucune offre SDP, aucun mouvement, aucune vidéo, aucun secret exposé.
        Une tentative par dix minutes. Les identifiants MQTT sont dérivés d'une
        implémentation tierce et restent expérimentaux pour AOSU.
      required: false
      default: false
      selector:
        boolean:

    tester_offre_mqtt:
      name: Tester une offre SDP AES/KCP vers la caméra candidate (actif, expérimental)
      description: >-
        Nécessite tester_rtc et tester_mqtt ainsi que confirmation_offre_mqtt.
        Envoie exactement une offre vidéo chiffrée, écoute au plus neuf secondes,
        puis envoie un message de déconnexion. Une offre peut temporairement
        réserver la caméra ou interrompre la disponibilité dans l'application.
        Pas de relay, pas de vidéo, pas de PTZ. Une tentative par 30 minutes.
      required: false
      default: false
      selector:
        boolean:
    confirmation_offre_mqtt:
      name: Je confirme vouloir envoyer une offre active à la C5L candidate
      description: >-
        Le nom correspond, mais l'identification matérielle n'est pas prouvée.
        Confirmer seulement si vous reconnaissez cet appareil et acceptez une
        éventuelle indisponibilité temporaire de la vidéo dans l'application.
      required: false
      default: false
      selector:
        boolean:

    tester_relais_tcp:
      name: Tester le handshake TCP du relais P2P (actif, expérimental)
      description: >-
        Nécessite RTC, MQTT, offre SDP, confirmation_offre_mqtt et confirmation_relais_tcp.
        Après une réponse SDP valide, établit une connexion TCP au relais officiel,
        vérifie le défi HMAC et clôt la connexion. Aucun média KCP, PTZ, ou vidéo.
        Peut rendre la caméra temporairement indisponible pendant la négociation.
      required: false
      default: false
      selector:
        boolean:
    confirmation_relais_tcp:
      name: J'autorise une connexion P2P TCP de test pour cette caméra candidate
      description: >-
        Une seule tentative; confirme que l'appareil identifié par son nom est le mien.
      required: false
      default: false
      selector:
        boolean:
    tester_kcp:
      name: Tester le tunnel KCP du relais (expérimental, actif)
      description: >-
        Nécessite toutes les confirmations MQTT et relais ainsi que confirmation_kcp.
        Réémet une seule fois l'offre SDP sur la connexion relais authentifiée
        et acquitte les trames KCP reçues. Aucun canal de contrôle 0, aucune
        commande de démarrage vidéo, aucun PTZ et aucun enregistrement.
      required: false
      default: false
      selector:
        boolean:
    confirmation_kcp:
      name: Je confirme l'essai actif du tunnel KCP sur cette caméra
      description: >-
        Réserver temporairement la caméra est possible; ne pas regarder
        simultanément le flux dans AOSU. Au plus une tentative par période de 30 min.
      required: false
      default: false
      selector:
        boolean:

    tester_media:
      name: Tester le démarrage du canal vidéo (expérimental, actif)
      description: >-
        Nécessite toutes les confirmations précédentes et confirmation_media.
        Lance une fois le canal 0 et observe pendant environ 11 s si des données
        vidéo KCP arrivent et peuvent être déchiffrées. Aucune commande PTZ.
        La caméra peut être temporairement réservée. Aucune image n'est sauvegardée.
      required: false
      default: false
      selector:
        boolean:
    confirmation_media:
      name: J'autorise explicitement le démarrage vidéo temporaire sur ma caméra
      description: >-
        La caméra est seulement identifiée par son nom. Fermer le direct AOSU.
        Une seule tentative, sans PTZ ni stockage d'images.
      required: false
      default: false
      selector:
        boolean:

    capturer_media_localement:
      name: Enregistrer temporairement les données vidéo déchiffrées (facultatif)
      description: >-
        FACULTATIF et sensible : requiert confirmation_capture_locale ET toutes
        les confirmations de démarrage vidéo. Écrit au maximum 256 Kio de
        données vidéo brutes dans /config/smart_aosu_cloud/diagnostics/ ;
        aucune transmission depuis Home Assistant vers un tiers. Les images
        d'un domicile peuvent être récupérables dans le fichier. À supprimer
        après analyse ; inclus dans les sauvegardes HA tant que conservé.
      required: false
      default: false
      selector:
        boolean:
    confirmation_capture_locale:
      name: Je consens à stocker temporairement des images potentielles de ma caméra
      description: >-
        Confirme explicitement le stockage local d'un court échantillon en clair.
        Ne communiquer ce fichier qu'en connaissance de son contenu privé.
        Aucune donnée brute dans les journaux ni la réponse d'action.
      required: false
      default: false
      selector:
        boolean:

decoder_capture_video_locale:
  name: Décoder la dernière capture vidéo locale (hors ligne)
  description: >-
    Aucun appel réseau, aucune commande caméra. Lit uniquement la dernière capture
    media_b27_*.aosudump déjà présente dans /config/smart_aosu_cloud/diagnostics.
    Vérifie HEVC/RTP et tente une image JPEG avec FFmpeg local. Ne retourne jamais
    de vidéo ni image brute. Un aperçu JPEG privé peut être sauvegardé avec mode 0600
    uniquement après accord explicite ; ne pas le placer dans /config/www.
  fields:
    confirmation_analyse_capture:
      name: J'autorise l'analyse locale de la capture privée
      required: true
      selector:
        boolean:
    enregistrer_apercu_prive:
      name: Conserver une seule image JPEG privée sur Home Assistant
      required: false
      default: false
      selector:
        boolean:

demarrer_direct_c5l:
  name: Démarrer le direct C5L P2P (expérimental)
  description: >-
    ACTION ACTIVE ET FACULTATIVE. Utilise une unique session P2P cloud Tuya,
    envoie les sept commandes de démarrage vidéo et publie les JPEG décodés
    dans une entité camera C5L en mémoire uniquement. Aucun PTZ et aucun
    enregistrement. Caméra identifiée par son nom, pas par un ID matériel confirmé.
    Aucun démarrage ni reconnexion automatique. Lecture peut relancer une nouvelle
    session après Arrêt sans les anciens délais de développement (5/30/60 minutes).
    Après un véritable refus ou une erreur, un court délai progressif évite les
    demandes excessives. Arrêt est manuel; 45 secondes sans vidéo ferment la session.
    Fermer le direct AOSU avant.
  fields:
    confirmation_envoi_mot_de_passe:
      name: J'autorise si nécessaire le login UID Tuya chiffré
      required: true
      selector:
        boolean:
    confirmation_camera_c5l:
      name: Je confirme que la caméra sélectionnée par son nom est bien ma C5L
      required: true
      selector:
        boolean:

arreter_direct_c5l:
  name: Arrêter immédiatement l'aperçu direct C5L
  description: >-
    Demande l'arrêt de la session P2P en cours et la libération du décodeur FFmpeg.

statut_direct_c5l:
  name: Statut de l'aperçu direct C5L
  description: >-
    Retourne uniquement des informations anonymisées de la session, du décodeur
    et du dernier essai. Ne renvoie ni vidéo, ni clés, ni identifiants.

audit_preparation_autres_cameras:
  name: Préparer les autres caméras AOSU (sans réseau)
  description: >-
    Examine seulement le dernier inventaire local Home Assistant. Compte les
    caméras et bases H1L, distingue les modèles publics C5L/C9C3CA11 si
    déclarés, et indique ce qui reste à valider côté P2P/PTZ.
    Aucun mot de passe, identifiant, numéro de série ou nom privé renvoyé.
    Aucun appel cloud, aucune ouverture vidéo et aucun mouvement de caméra.

audit_ptz_c5l:
  name: C5L — diagnostic PTZ et actualisation OEM (sans mouvement)
  description: >-
    Sans option, examine les caches locaux. Avec actualiser_cache_oem et
    confirmation_envoi_mot_de_passe, effectue une lecture seule du catalogue
    Tuya par des API deja validees. Aucun RTC, MQTT, mouvement ou PTZ.
  fields:
    actualiser_cache_oem:
      name: Actualiser les appareils OEM (lecture seule)
      description: Interroge explicitement les listes Tuya sans piloter la camera.
      required: false
      default: false
      selector:
        boolean: {}
    confirmation_envoi_mot_de_passe:
      name: Autoriser login OEM si session expiree
      description: Peut envoyer le mot de passe chiffre vers Tuya si une nouvelle session est necessaire.
      required: false
      default: false
      selector:
        boolean: {}

audit_ptz_schema_detaille_c5l:
  name: C5L — lire la fiche Tuya détaillée (PTZ, sans mouvement)
  description: >-
    Lecture seule via thing.m.device.get v4.1, API vérifiée dans l APK AOSU.
    Actualise si nécessaire le cache OEM puis lit la fiche détaillée, avec deux confirmations.
    Interroge uniquement l appareil C5L identifié de façon unique dans le cache,
    n envoie aucune commande de mouvement ou d arrêt et ne renvoie aucune valeur privée.
    Maximum une tentative toutes les 120 secondes ; à lancer hors direct.
  fields:
    confirmation_envoi_mot_de_passe:
      name: Autoriser un login OEM chiffré si nécessaire
      required: true
      selector:
        boolean: {}
    confirmation_camera_c5l:
      name: Je confirme que C5L est bien ma C5L
      required: true
      selector:
        boolean: {}

audit_structure_ptz_c5l:
  name: C5L — forme des datapoints PTZ OEM b44 (sans mouvement)
  description: >-
    Lecture seule de la fiche Tuya C5L : indique si les codes ptz_control et
    ptz_stop sont de simples valeurs/indicateurs ou de vraies definitions de
    schema. Renvoye uniquement des types, categories et noms de champs connus,
    jamais les valeurs ni les identifiants. Aucun MQTT, mouvement ou changement
    video. Utilise l API de lecture thing.m.device.get v4.1. Une lecture toutes
    les 120 secondes, apres deux confirmations, hors direct.
  fields:
    confirmation_envoi_mot_de_passe:
      name: Autoriser login chiffré si nécessaire
      required: true
      selector:
        boolean: {}
    confirmation_camera_c5l:
      name: Je confirme que C5L est bien ma C5L
      required: true
      selector:
        boolean: {}

essayer_arret_ptz_c5l:
  name: C5L C5L — essai de commande PTZ Arrêt uniquement
  description: >-
    Essai expérimental d une seule publication Tuya ptz_stop=true, API
    thing.m.device.dp.publish v2.0 observée dans l APK. Ne transmet aucune
    direction ni aucun mouvement. N équivaut pas à un arrêt moteur vérifié.
    Trois confirmations exigées ; actualisation OEM si nécessaire, caméra C5L unique,
    direct inactif. Une tentative toutes les 120 secondes ; aucun renvoi de secret.
  fields:
    confirmation_envoi_mot_de_passe:
      name: Autoriser l authentification OEM chiffrée si nécessaire
      required: true
      selector:
        boolean: {}
    confirmation_camera_c5l:
      name: Je confirme que C5L est bien ma C5L
      required: true
      selector:
        boolean: {}
    confirmation_test_arret:
      name: J autorise un unique ordre PTZ Arrêt, sans déplacement
      required: true
      selector:
        boolean: {}

audit_canal_ptz_direct_c5l:
  name: C5L — observer le canal PTZ pendant le direct
  description: >-
    Analyse en lecture seule du canal de controle KCP de la session video C5L
    deja active. Ne lance aucune session, ne publie aucun DP et n envoie aucune
    commande de mouvement ou d arret. Ne conserve aucune charge utile, video,
    cle, identifiant ni message brut. Marquer le debut permet de comparer les
    compteurs avant et apres un test via l application officielle.
  fields:
    marquer_debut_comparaison:
      name: Remettre a zero le point de comparaison des compteurs
      description: Conserve uniquement les compteurs comme point de reference.
      required: false
      selector:
        boolean: {}

audit_mqtt_ptz_direct_c5l:
  name: C5L — observer le MQTT pendant le direct (PTZ)
  description: >-
    Lit uniquement les compteurs des messages MQTT deja recus sur la
    connexion de signalisation P2P existante, sans seconde connexion,
    publication de DP, mouvement ou sauvegarde de contenu prive.
    Les messages de l application AOSU peuvent utiliser une autre session ;
    une absence de messages ne prouve pas l absence de PTZ via MQTT.
    Le test n ajoute aucune negociation et ne coupe pas la video.
  fields:
    marquer_debut_comparaison:
      name: Marquer le debut de la comparaison
      description: Enregistre uniquement des compteurs de trafic comme reference.
      required: false
      selector:
        boolean: {}


audit_publication_ptz_c5l:
  name: C5L — audit de publication PTZ Tuya b43 (sans mouvement)
  description: >-
    Verifie en lecture seule les prealables des commandes Tuya en ligne :
    modele, association OEM de la camera, codes et types des datapoints,
    declaration des droits d ecriture et etat de session deja en memoire.
    Aucun appel reseau, aucune connexion MQTT supplementaire, aucune
    commande PTZ ou STOP et aucune modification du direct video.
    La connexion MQTT existante sert uniquement a la signalisation video.

essayer_arret_ptz_dp116_c5l:
  name: C5L C5L — essai STOP numérique DP 116 (expérimental)
  description: >-
    Essai manuel strictement limité à une seule publication HTTP Tuya
    thing.m.device.dp.publish v2.0 avec dps {"116":true}. Contrairement au test
    b40, utilise l identifiant numérique standard Tuya 116. Il n est PAS
    confirmé par le schema propre à la C5L et peut être refusé. N envoie
    jamais de mouvement, ne touche pas à la vidéo HA, sans retry ni alternative,
