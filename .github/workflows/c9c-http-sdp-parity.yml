name: C9C OEM HTTP SDP/token parity (synthetic offline)

on:
  push:
    branches:
      - research/c9c-http-refusal-native-parity
    paths:
      - tools/aosu_c9c_http_sdp_parity_offline.py
      - tests/test_aosu_c9c_http_sdp_parity_offline.py
      - .github/workflows/c9c-http-sdp-parity.yml
  pull_request:
    paths:
      - tools/aosu_c9c_http_sdp_parity_offline.py
      - tests/test_aosu_c9c_http_sdp_parity_offline.py
      - .github/workflows/c9c-http-sdp-parity.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pure Python syntax
        run: python -m compileall -q tools tests custom_components/smart_aosu_cloud
      - name: Validate synthetic native SDP/token branching
        run: python -m unittest discover -s tests -p 'test_aosu_c9c_http_sdp_parity_offline.py' -v
