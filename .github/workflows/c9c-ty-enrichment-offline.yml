name: C9C Android Ty SDK enrichment route (offline)

on:
  push:
    paths:
      - 'tools/aosu_ty_device_enrichment_offline.py'
      - 'tools/aosu_sdk_route_offline.py'
      - 'tests/test_aosu_ty_device_enrichment_offline.py'
      - '.github/workflows/c9c-ty-enrichment-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-bridge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax (no APK files are stored in CI)
        run: python -m compileall -q tools/aosu_ty_device_enrichment_offline.py tests/test_aosu_ty_device_enrichment_offline.py
      - name: Mock Android SDK route with synthetic calls only
        run: python -m unittest discover -s tests -p 'test_aosu_ty_device_enrichment_offline.py' -v
