name: AOSU CP cache routing offline regression

on:
  push:
    paths:
      - 'tools/aosu_cp_cache_route_offline.py'
      - 'tests/test_aosu_cp_cache_route_offline.py'
      - 'tools/aosu_sdk_route_offline.py'
      - 'custom_components/smart_aosu_cloud/camera_topology.py'
      - '.github/workflows/aosu-cp-cache-audit.yml'
  workflow_dispatch:

jobs:
  static-cp-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile tools/aosu_sdk_route_offline.py tools/aosu_cp_cache_route_offline.py tests/test_aosu_cp_cache_route_offline.py
      - name: Offline identity, privacy and topology tests
        run: python -m unittest discover -s tests -p 'test_aosu_cp_cache_route_offline.py' -v
