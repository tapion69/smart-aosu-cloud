name: Smart AOSU C9C Linux client portability audit

on:
  push:
    branches:
      - experiment/c9c-native-session-contract
    paths:
      - tools/aosu_c9c_client_abi_portability_offline.py
      - tests/test_aosu_c9c_client_abi_portability_offline.py
      - .github/workflows/aosu-c9c-client-abi-offline.yml
  pull_request:
    paths:
      - tools/aosu_c9c_client_abi_portability_offline.py
      - tests/test_aosu_c9c_client_abi_portability_offline.py
      - .github/workflows/aosu-c9c-client-abi-offline.yml

permissions:
  contents: read

jobs:
  pure-synthetic-elf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ABI metadata parser without private APK
        run: python -m unittest discover -s tests -p 'test_aosu_c9c_client_abi_portability_offline.py' -v
