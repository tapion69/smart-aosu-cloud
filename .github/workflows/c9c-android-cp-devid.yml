name: C9C native Android CP to Tuya devId bridge

on:
  push:
    branches:
      - experiment/c9c-android-cpdeviceid-to-tuya-devid
      - main
    paths:
      - custom_components/smart_aosu_cloud/camera_topology.py
      - custom_components/smart_aosu_cloud/tuya_rtc_inventory.py
      - tests/test_c9c_android_cp_devid_bridge.py
      - tests/test_c9c_ty_cp_uuid_identity.py
      - .github/workflows/c9c-android-cp-devid.yml
  pull_request:
    paths:
      - custom_components/smart_aosu_cloud/camera_topology.py
      - custom_components/smart_aosu_cloud/tuya_rtc_inventory.py
      - tests/test_c9c_android_cp_devid_bridge.py
      - tests/test_c9c_ty_cp_uuid_identity.py
      - .github/workflows/c9c-android-cp-devid.yml

permissions:
  contents: read

jobs:
  typed-identity-no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integration
        run: python -m compileall -q custom_components/smart_aosu_cloud
      - name: Verify Android CP device ID and independent namespaces
        run: |
          python -m unittest discover -s tests -p 'test_c9c_android_cp_devid_bridge.py' -v
          python -m unittest discover -s tests -p 'test_c9c_ty_cp_uuid_identity.py' -v
          python -m unittest discover -s tests -p 'test_c9c_standalone.py' -v
