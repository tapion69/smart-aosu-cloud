name: AOSU no-root Windows CP probe

on:
  push:
    paths:
      - 'tools/windows/AOSU_CP_SANS_ROOT.ps1'
      - 'tools/windows/LANCER_AOSU_CP.cmd'
      - '.github/workflows/aosu-adb-cp-windows.yml'
  workflow_dispatch:

jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check native PowerShell and privacy
        shell: pwsh
        run: |
          & ./tools/windows/AOSU_CP_SANS_ROOT.ps1 -SelfTest
      - name: Validate compatibility with Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\tools\windows\AOSU_CP_SANS_ROOT.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 selftest failed' }
      - name: Full fake ADB USB and logcat test on Windows PowerShell 5.1
        shell: powershell
        run: |
          $code = @'
          using System;
          public static class MockAdb {
              public static int Main(string[] args) {
                  if(args.Length > 0 && args[0] == "devices") {
                      Console.Error.WriteLine("* daemon started successfully");
                      Console.WriteLine("List of devices attached");
                      Console.WriteLine("FAKEDEVICE123\tdevice");
                      return 0;
                  }
                  if(args.Length >= 2 && args[0] == "shell" && args[1] == "pidof") {
                      Console.WriteLine("4242");
                      return 0;
                  }
                  if(args.Length > 0 && args[0] == "logcat") {
                      Console.WriteLine("I/AOSU : loadDeviceInfoList load gz device success");
                      Console.WriteLine("I/AOSU : loadDeviceInfoList load ty device success");
                      Console.WriteLine("I/AOSU : cpData setMemoryCache deviceIdTy2GzMap size:1");
                      Console.WriteLine("I/AOSU : targetCpDeviceId=SECRET_FAKE_CP");
                      Console.WriteLine("I/AOSU : token=SECRET_FAKE_TOKEN");
                      return 0;
                  }
                  return 11;
              }
          }
          '@
          $fake = Join-Path $env:RUNNER_TEMP 'fake_adb_ok.exe'
          Add-Type -TypeDefinition $code -OutputAssembly $fake -OutputType ConsoleApplication
          $stdout=@(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\windows\AOSU_CP_SANS_ROOT.ps1 -AutoRead -AdbPath $fake)
          $status=$LASTEXITCODE
          $text=$stdout -join [Environment]::NewLine
          if($status -ne 0) { throw ('mock ADB process exit code: '+$status) }
          $begin=[Array]::IndexOf($stdout,'=== RAPPORT ANONYMISE ===')
          $end=[Array]::IndexOf($stdout,'=== FIN DU RAPPORT ===')
          if($begin -lt 0 -or $end -le ($begin+1)) {
              throw ('Mock report boundaries missing, phase=' + ($stdout -join ' | '))
          }
          $json=@($stdout[($begin+1)..($end-1)]) -join [Environment]::NewLine
          $parsed=ConvertFrom-Json -InputObject $json
          if(-not $parsed.valeur_cp_potentielle_dans_journal -or
             -not $parsed.rapprochement_cache -or
             -not $parsed.chargement_liste_aosu -or
             -not $parsed.chargement_liste_tuya -or
             $parsed.identite_c9c_tuya_prouvee -or
             $text.Contains('SECRET_FAKE_CP') -or
             $text.Contains('SECRET_FAKE_TOKEN')) {
              throw ('Mock failed: flags=' + $parsed.valeur_cp_potentielle_dans_journal +
                     '/' + $parsed.rapprochement_cache + '/' +
                     $parsed.chargement_liste_aosu + '/' +
                     $parsed.chargement_liste_tuya)
          }
      - name: Fake USB unauthorized device produces precise safe diagnostic
        shell: powershell
        run: |
          $code = @'
          using System;
          public static class MockAdbUnauthorized {
              public static int Main(string[] args) {
                  if(args.Length > 0 && args[0] == "devices") {
                      Console.WriteLine("List of devices attached");
                      Console.WriteLine("FAKEDEVICE123\tunauthorized");
                      return 0;
                  }
                  return 11;
              }
          }
          '@
          $fake = Join-Path $env:RUNNER_TEMP 'fake_adb_unauthorized.exe'
          Add-Type -TypeDefinition $code -OutputAssembly $fake -OutputType ConsoleApplication
          $stdout=@(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\windows\AOSU_CP_SANS_ROOT.ps1 -AutoRead -AdbPath $fake)
          $status=$LASTEXITCODE
          $text=$stdout -join [Environment]::NewLine
          if($status -ne 3 -or -not $text.Contains('TELEPHONE_ABSENT_NON_AUTORISE_OU_MULTIPLE')) {
              throw 'Unauthorized fake USB device was not classified correctly'
          }
      - name: Verify no ADB modification actions
        shell: pwsh
        run: |
          $src = Get-Content tools/windows/AOSU_CP_SANS_ROOT.ps1 -Raw
          if ($src -match '(?m)^\s*&\s*\$adb\s+(?:push|install|root|remount|reboot|shell\s+su)\b') { throw 'forbidden ADB action' }
          if ($src -match '(?m)^\s*&\s*\$adb\s+logcat\s+-c\b') { throw 'forbidden log erasure' }
      - name: Package tested Windows files
        shell: pwsh
        run: |
          Compress-Archive -Path @('tools/windows/AOSU_CP_SANS_ROOT.ps1','tools/windows/LANCER_AOSU_CP.cmd','tools/windows/README_AOSU_CP.md') -DestinationPath AOSU_CP_SANS_ROOT_WINDOWS.zip
      - name: Publish Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AOSU_CP_SANS_ROOT_WINDOWS
          path: AOSU_CP_SANS_ROOT_WINDOWS.zip
          retention-days: 30
