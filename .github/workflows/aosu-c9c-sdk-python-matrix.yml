name: AOSU C9C SDK Python offline parity matrix

on:
  push:
    paths:
      - 'tools/aosu_c9c_sdk_python_coverage.py'
      - 'tests/test_aosu_c9c_sdk_python_coverage.py'
      - 'custom_components/smart_aosu_cloud/tuya_mqtt_offer.py'
      - 'custom_components/smart_aosu_cloud/tuya_mqtt_signaling.py'
      - 'custom_components/smart_aosu_cloud/camera_topology.py'
      - '.github/workflows/aosu-c9c-sdk-python-matrix.yml'
  workflow_dispatch:

jobs:
  static-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile tools/aosu_c9c_sdk_python_coverage.py tests/test_aosu_c9c_sdk_python_coverage.py
      - name: Full synthetic offline tests
        run: python -m unittest discover -s tests -p 'test_aosu_c9c_sdk_python_coverage.py' -v
