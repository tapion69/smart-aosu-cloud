name: C9C standalone beta32 CP identity regression

on:
  push:
    paths:
      - 'custom_components/smart_aosu_cloud/api.py'
      - 'custom_components/smart_aosu_cloud/c9c_cp_reference_b32.py'
      - 'custom_components/smart_aosu_cloud/camera_topology.py'
      - 'custom_components/smart_aosu_cloud/__init__.py'
      - 'custom_components/smart_aosu_cloud/frontend/c9c-autonome-b1.js'
      - 'tests/test_c9c_cp_reference_b32.py'
      - 'tests/test_c9c_standalone.py'
      - '.github/workflows/c9c-beta32-cp-reference.yml'
  workflow_dispatch:

jobs:
  c9c-cp-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q custom_components/smart_aosu_cloud
      - name: JavaScript syntax
        run: node --check custom_components/smart_aosu_cloud/frontend/c9c-autonome-b1.js
      - name: Test C9C exact identity, conflict and privacy
        run: python -m unittest discover -s tests -p 'test_c9c_cp_reference_b32.py' -v
      - name: Legacy C5L/H1L topology and C9C selection tests
        run: python -m unittest discover -s tests -p 'test_c9c_standalone.py' -v
