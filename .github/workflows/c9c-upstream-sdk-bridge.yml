name: C9C real Python SDK bridge (offline synthetic)

on:
  push:
    branches:
      - experiment/c9c-android-cpdeviceid-to-tuya-devid
    paths:
      - custom_components/smart_aosu_cloud/c9c_upstream_sdk_bridge.py
      - tests/test_c9c_upstream_sdk_bridge.py
      - .github/workflows/c9c-upstream-sdk-bridge.yml
  pull_request:
    paths:
      - custom_components/smart_aosu_cloud/c9c_upstream_sdk_bridge.py
      - tests/test_c9c_upstream_sdk_bridge.py
      - .github/workflows/c9c-upstream-sdk-bridge.yml

permissions:
  contents: read

jobs:
  real-sdk-models-fake-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public MIT SDK for integration contract checks
        run: python -m pip install 'tuya-ipc-p2p-sdk==0.1.3'
      - name: Syntax verify
        run: python -m compileall -q custom_components/smart_aosu_cloud
      - name: Real SDK object compatibility; simulate transport without camera
        run: python -m unittest discover -s tests -p 'test_c9c_upstream_sdk_bridge.py' -v
