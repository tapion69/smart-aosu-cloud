name: Smart AOSU C9C native connect session evidence

on:
  push:
    branches:
      - experiment/c9c-native-session-contract
    paths:
      - tools/aosu_c9c_native_connect_session_offline.py
      - tests/test_aosu_c9c_native_connect_session_offline.py
      - .github/workflows/aosu-c9c-native-connect-session.yml
  pull_request:
    paths:
      - tools/aosu_c9c_native_connect_session_offline.py
      - tests/test_aosu_c9c_native_connect_session_offline.py
      - .github/workflows/aosu-c9c-native-connect-session.yml

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native connect_session evidence using synthetic ELF only
        run: python -m unittest discover -s tests -p 'test_aosu_c9c_native_connect_session_offline.py' -v
