name: C9C ICE candidate preflight (experimental branch)
on:
  push:
    paths:
      - 'custom_components/smart_aosu_cloud/tuya_mqtt_offer.py'
      - 'tests/test_c9c_ice_preflight.py'
      - 'custom_components/smart_aosu_cloud/camera_topology.py'
      - 'custom_components/smart_aosu_cloud/tuya_rtc_inventory.py'
      - 'tests/test_c9c_standalone.py'
      - '.github/workflows/c9c-ice-preflight.yml'
  workflow_dispatch:
jobs:
  offline-mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q custom_components/smart_aosu_cloud
      - run: python -m unittest discover -s tests -p 'test_c9c_ice_preflight.py' -v
      - run: python -m unittest discover -s tests -p 'test_c9c_standalone.py' -v
